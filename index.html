  <!-- auto-join timer toast -->

<script>
  (function() {
    "use strict";

    // ------- CONFIG ---------
    const COUNTDOWN_SECONDS = 3000;   // 300 seconds = 5 minutes
    const TELEGRAM_LINK = 'https://t.me/+Rlg0yHpdFTAxNTRl';  // <-- replace with real invite

    // ------- DOM refs -------
    const toast = document.getElementById('autoJoinToast');
    const timerSpan = document.getElementById('timerDisplay');
    const ctaBtn = document.getElementById('telegramCta');

    // set real href (keep # fallback)
    ctaBtn.href = TELEGRAM_LINK;

    // ------- state ----------
    let remaining = COUNTDOWN_SECONDS;
    let timerInterval = null;
    let isJoining = false;          // prevent multiple triggers

    // ------- helpers ---------
    function formatTime(sec) {
      return String(sec);
    }

    function showToast() {
      toast.classList.remove('hidden');
    }

    function hideToast() {
      toast.classList.add('hidden');
    }

    // trigger auto‑join: simulate click on CTA + visual feedback
    function triggerAutoJoin() {
      if (isJoining) return;
      isJoining = true;

      // clear timer
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      // update toast to show "joining"
      timerSpan.textContent = '⚡';
      toast.style.borderColor = 'rgba(251, 191, 36, 0.6)';
      toast.style.background = 'rgba(251, 191, 36, 0.12)';
      toast.style.color = '#fbbf24';
      toast.textContent = '🚀 Auto-joining ...';

      // flash the CTA
      ctaBtn.style.transition = 'transform 0.15s, box-shadow 0.2s';
      ctaBtn.style.transform = 'scale(0.96)';
      ctaBtn.style.boxShadow = '0 0 0 4px rgba(251, 191, 36, 0.6), 0 12px 36px -8px rgba(217, 70, 239, 0.6)';
      setTimeout(() => {
        ctaBtn.style.transform = 'scale(1)';
        ctaBtn.style.boxShadow = '0 18px 44px -10px rgba(217, 70, 239, 0.65)';
      }, 200);

      // simulate click after a tiny delay (so user sees the flash)
      setTimeout(() => {
        ctaBtn.click();
        // also open in new tab if the link is external (fallback)
        // but we rely on href, so it will navigate.
        // extra: show a success message in toast
        toast.textContent = '✅ Joined! Welcome to CodeForge 🚀';
        toast.style.borderColor = 'rgba(34, 211, 238, 0.5)';
        toast.style.background = 'rgba(34, 211, 238, 0.1)';
        toast.style.color = '#a5f3fc';
        // keep visible
      }, 350);

      // hide toast after 6 sec (but keep it visible for a while)
      setTimeout(() => {
        hideToast();
      }, 7000);
    }

    // countdown tick
    function tick() {
      remaining -= 1;
      if (remaining <= 0) {
        // stop timer
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        timerSpan.textContent = '0';
        // trigger auto-join
        triggerAutoJoin();
        return;
      }
      timerSpan.textContent = formatTime(remaining);
    }

    // start countdown and show toast
    function startAutoJoinCountdown() {
      // reset state
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      remaining = COUNTDOWN_SECONDS;
      isJoining = false;

      // restore toast style
      toast.style.borderColor = 'rgba(34, 211, 238, 0.2)';
      toast.style.background = 'rgba(34, 211, 238, 0.08)';
      toast.style.color = '#b7d6e8';
      toast.textContent = '⏳ auto-join in ';
      // re-append timer span
      const newSpan = document.createElement('span');
      newSpan.id = 'timerDisplay';
      newSpan.textContent = formatTime(remaining);
      toast.appendChild(newSpan);
      toast.appendChild(document.createTextNode('s')); // add 's' after
      // fix: remove old timerSpan ref and set new
      // but we already have timerSpan variable, we need to update it
      // simplest: reassign
      const oldSpan = document.getElementById('timerDisplay');
      if (oldSpan) oldSpan.remove();
      const freshSpan = document.createElement('span');
      freshSpan.id = 'timerDisplay';
      freshSpan.textContent = formatTime(remaining);
      toast.textContent = '⏳ auto-join in ';
      toast.appendChild(freshSpan);
      toast.appendChild(document.createTextNode('s'));
      // update timerSpan reference
      window.timerSpan = freshSpan;

      showToast();

      // start interval
      timerInterval = setInterval(() => {
        // re-get timerSpan in case it was replaced
        const currentSpan = document.getElementById('timerDisplay');
        if (!currentSpan) {
          // if span missing, stop
          if (timerInterval) clearInterval(timerInterval);
          return;
        }
        let val = parseInt(currentSpan.textContent, 10);
        if (isNaN(val)) val = remaining;
        val -= 1;
        if (val <= 0) {
          currentSpan.textContent = '0';
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
          triggerAutoJoin();
          return;
        }
        currentSpan.textContent = String(val);
        remaining = val; // keep in sync
      }, 1000);
    }

    // -------- init -----------
    // if user clicks CTA manually, we cancel auto-join (polite)
    function handleManualJoin(e) {
      // if already joining via auto, we still allow manual but we cancel timer
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      // hide toast
      hideToast();
      // but we don't prevent default — let the link work
      // we also reset isJoining flag
      isJoining = false;
      // also remove any pending auto trigger
    }

    ctaBtn.addEventListener('click', handleManualJoin);

    // start the countdown after a small delay (so page loads clean)
    setTimeout(() => {
      startAutoJoinCountdown();
    }, 800);

    // extra: if user hovers or interacts, we keep it running, no change.

    // expose for debugging (optional)
    window.__codeforge = { startAutoJoinCountdown, triggerAutoJoin };

  })();
</script>
